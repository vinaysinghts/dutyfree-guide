[project]
name = "dutyfree-scrapers"
version = "0.1.0"
description = "Daily duty-free price collectors for the Duty Free Guide app"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dutyfree-scrape = "dutyfree_scrapers.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dutyfree_scrapers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
