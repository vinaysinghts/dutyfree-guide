name: Sync app problem reports

# Safety net for in-app problem reports (ADR 0010). The app asks the file-issue
# Edge Function to open a GitHub issue right away; if that failed (GitHub down,
# app went offline, token not set yet), the report waits in the issue_reports
# table and this job files it. Safe to run any time: the function leases each
# report, so a report is never filed twice by two runs.
on:
  schedule:
    - cron: "17 * * * *" # hourly, off the top of the hour
  workflow_dispatch:

concurrency:
  group: issue-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FUNCTION_URL: https://pkywwbvqpwomvbldgbyw.supabase.co/functions/v1/file-issue
      SYNC_TOKEN: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: File unfiled reports
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::notice::SUPABASE_SERVICE_ROLE_KEY is not set; nothing to do."
            exit 0
          fi
          status=$(curl -sS -o result.json -w '%{http_code}' -X POST "$FUNCTION_URL" \
            -H "Authorization: Bearer $SYNC_TOKEN" -H 'Content-Type: application/json' \
            -d '{"sweep":true}')
          cat result.json; echo
          if [ "$status" = 404 ]; then
            echo "::notice::file-issue is not deployed yet (run the Supabase deploy workflow)."
            exit 0
          fi
          [ "$status" = 200 ] || { echo "::error::file-issue returned HTTP $status"; exit 1; }
          if grep -q '"status":"failed"' result.json; then
            echo "::warning::Some reports could not be filed; see last_error in issue_reports."
          fi
