name: Supabase deploy

# Applies database migrations to the hosted project, loads every airport from
# OurAirports, then runs a scrape. Runs when supabase/ changes on main, or by
# hand from the Actions tab. Needs three repo secrets (README "Backend setup"):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_SERVICE_ROLE_KEY
# Optional: ISSUES_GITHUB_TOKEN, so in-app problem reports become GitHub issues (ADR 0010).
on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase-deploy.yml"]
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false # never interrupt a migration

env:
  # Public identifiers, not secrets: the app ships the URL anyway.
  SUPABASE_PROJECT_REF: pkywwbvqpwomvbldgbyw
  SUPABASE_URL: https://pkywwbvqpwomvbldgbyw.supabase.co
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  ISSUES_GITHUB_TOKEN: ${{ secrets.ISSUES_GITHUB_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check secrets
        run: |
          missing=""
          for s in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_SERVICE_ROLE_KEY; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets first:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with: { version: 2.122.1 }

      # Shows exactly which migrations are new before applying anything.
      - name: Link project and list pending migrations
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase migration list --password "$SUPABASE_DB_PASSWORD"

      # Migrations are applied in filename order, each once (tracked in
      # supabase_migrations.schema_migrations). The seed adds the BLR and AMS
      # retailers; it is idempotent (ON CONFLICT DO NOTHING).
      - name: Apply migrations and seed
        run: supabase db push --include-seed --password "$SUPABASE_DB_PASSWORD" --yes

      # Edge Functions (supabase/functions/*). Secrets go to the function's own
      # environment; they never reach the app. SYNC_TOKEN reuses the service
      # role key so the hourly "Sync app problem reports" job can authenticate
      # without yet another secret to manage.
      - name: Deploy Edge Functions and their secrets
        run: |
          supabase functions deploy file-issue --project-ref "$SUPABASE_PROJECT_REF"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" SYNC_TOKEN="$SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$ISSUES_GITHUB_TOKEN" ]; then
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" GITHUB_ISSUES_TOKEN="$ISSUES_GITHUB_TOKEN" GITHUB_REPO="$GITHUB_REPOSITORY"
          else
            echo "::warning::ISSUES_GITHUB_TOKEN is not set: problem reports are saved but not posted to GitHub yet."
          fi

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e scrapers

      - name: Load airports
        run: dutyfree-scrape airports

      # First scrape. Informational until the adapters are verified against the
      # live sites (Scraper live check workflow): a 0-price retailer exits 1.
      - name: Scrape prices
        continue-on-error: true
        run: dutyfree-scrape run
