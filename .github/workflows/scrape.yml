name: Daily price scrape

on:
  schedule:
    - cron: "30 1 * * *" # 07:00 IST, once a day is plenty: duty-free prices change slowly
  workflow_dispatch:

jobs:
  scrape:
    # Stays off until the adapters have been checked against the live sites
    # and Supabase secrets are added (see scrapers/README.md).
    if: vars.SCRAPE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: scrapers } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - run: dutyfree-scrape run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
